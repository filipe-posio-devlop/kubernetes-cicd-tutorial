name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Update GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
      
          # Configure Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
          # Remove previous checkout
          if (Test-Path "gitops") {
              Remove-Item -Recurse -Force "gitops"
          }
      
          # Clone using token
          $repoUrl = "https://x-access-token:$env:GIT_TOKEN@github.com/filipe-posio-devlop/grade-api-gitops.git"
      
          git clone $repoUrl gitops
      
          Set-Location gitops
      
          # Update image
          $deploymentFile = "deployment.yaml"
      
          $content = Get-Content $deploymentFile -Raw
      
          $newImage = "image: $env:IMAGE_NAME`:$env:IMAGE_TAG"
      
          $content = $content -replace `
              "image:\s*ghcr\.io/filipe-posio-devlop/kubernetes-cicd-tutorial:.*", `
              $newImage
      
          Set-Content $deploymentFile $content -NoNewline
      
          # Show the resulting image
          Write-Host "Updated deployment:"
          Select-String "image:" $deploymentFile
      
          # Check for changes
          git diff -- deployment.yaml
      
          if (git diff --quiet -- deployment.yaml) {
              Write-Host "No changes detected."
              exit 0
          }
      
          # Commit
          git add deployment.yaml
      
          git commit -m "Update image to $env:IMAGE_TAG"
      
          # Push
          git push origin main
